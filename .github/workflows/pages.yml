name: Hosted canvas

# Publishes the hosted canvas (web/static) to GitHub Pages: the Klose canvas
# as a plain site that reads and writes .klose/ in a folder the browser is
# given, with no server. One-time setup in the repo: Settings → Pages →
# Source: "GitHub Actions". The site then lives at
# https://<owner>.github.io/<repo>/ and updates on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued one for an older commit has nothing to add.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # A project site is served under /<repo>/; the build has to know.
      - name: Build the hosted canvas
        run: node scripts/build-static.mjs --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
